<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>C-Voxel Studio</title>
  
  <!-- Fontes Profissionais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js e OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-dark: #121316;
      --bg-panel: #1e1f24;
      --bg-header: #18191c;
      --border-color: #2d3037;
      --accent-color: #007acc;
      --accent-hover: #0098ff;
      --text-main: #e1e4ea;
      --text-muted: #8b909a;
      --editor-kw: #569cd6;
      --editor-type: #4ec9b0;
      --editor-str: #ce9178;
      --editor-num: #b5cea8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); }

    /* Layout Principal */
    #studio-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
    
    /* Topbar Professional */
    header {
      height: 48px; background: var(--bg-header); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; z-index: 100;
    }
    .brand { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--accent-hover); }

    .toolbar-group { display: flex; align-items: center; gap: 6px; }
    .btn {
      background: #2a2d34; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .btn:hover { background: #353942; border-color: #454954; }
    .btn-primary { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Menu Dropdown de Inserção */
    .dropdown { position: relative; }
    .dropdown-menu {
      display: none; position: absolute; top: 110%; left: 0; background: var(--bg-panel);
      border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      min-width: 140px; z-index: 200; overflow: hidden;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 8px 12px; font-size: 12px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .dropdown-item:hover { background: var(--accent-color); color: #fff; }

    /* Layout Workspace Area */
    .workspace { display: flex; flex: 1; height: calc(100vh - 48px); overflow: hidden; }

    /* Painel Esquerdo: Editor de Código */
    .panel-left {
      width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column;
    }
    .panel-header {
      height: 32px; background: #16171a; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; justify-content: space-between;
    }

    /* Container de Editor com Highlighting */
    .code-editor-container { position: relative; flex: 1; overflow: hidden; background: #1e1e1e; }
    .code-input, .code-highlight {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      padding: 12px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; tab-size: 2; border: none; outline: none;
    }
    .code-input {
      color: transparent; background: transparent; caret-color: #fff; z-index: 2; resize: none;
    }
    .code-highlight { z-index: 1; pointer-events: none; overflow: auto; }

    /* Cores de Sintaxe */
    .token-kw { color: var(--editor-kw); font-weight: 600; }
    .token-type { color: var(--editor-type); }
    .token-str { color: var(--editor-str); }
    .token-num { color: var(--editor-num); }
    .token-comment { color: #6a9955; font-style: italic; }

    /* Painel Central: Viewport 3D + Output */
    .panel-center { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; }
    #viewport-container { flex: 1; position: relative; width: 100%; height: 100%; }
    #three-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    /* Joystick de Movimentação (Apenas Esquerda) */
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px;
      background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; touch-action: none; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    #joystick-knob {
      width: 40px; height: 40px; background: rgba(0, 122, 204, 0.8);
      border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Output Console Separado */
    .panel-output {
      height: 120px; background: #141518; border-top: 1px solid var(--border-color);
      display: flex; flex-direction: column; font-family: 'Fira Code', monospace; font-size: 11px;
    }
    .output-logs { flex: 1; padding: 8px; overflow-y: auto; color: var(--text-muted); }
    .log-entry { margin-bottom: 4px; display: flex; gap: 6px; }
    .log-entry.info { color: #4ec9b0; }
    .log-entry.error { color: #f48771; }

    /* Painel Direito: Explorer & Propriedades */
    .panel-right {
      width: 280px; background: var(--bg-panel); border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column;
    }
    .explorer-tree { flex: 1; overflow-y: auto; padding: 6px; border-bottom: 1px solid var(--border-color); }
    .tree-item {
      padding: 6px 8px; border-radius: 4px; font-size: 12px; display: flex; align-items: center;
      gap: 6px; cursor: pointer; color: var(--text-main); margin-bottom: 2px;
    }
    .tree-item:hover { background: #2a2d34; }
    .tree-item.selected { background: var(--accent-color); color: #fff; }

    .properties-grid { padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 11px; overflow-y: auto; height: 180px; }
    .prop-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .prop-label { color: var(--text-muted); width: 70px; }
    .prop-input {
      flex: 1; background: #141518; border: 1px solid var(--border-color); color: #fff;
      padding: 4px 6px; border-radius: 3px; font-family: 'Fira Code', monospace; font-size: 11px;
    }
    .prop-checkbox { width: 16px; height: 16px; accent-color: var(--accent-color); }

    /* Suporte a Telas Menores (Mobile Responsive Tabs) */
    @media (max-width: 800px) {
      .panel-left { width: 100%; display: none; }
      .panel-right { width: 100%; display: none; }
      .panel-left.active, .panel-right.active, .panel-center.active { display: flex; flex: 1; }
      .mobile-tabs { display: flex !important; }
    }
    .mobile-tabs { display: none; background: #101113; border-top: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 11px; color: var(--text-muted); background: none; border: none; }
    .tab-btn.active { color: var(--accent-hover); font-weight: bold; border-top: 2px solid var(--accent-hover); }
  </style>
</head>
<body>

<div id="studio-container">
  <!-- Topbar -->
  <header>
    <div class="brand"><span>C-Voxel</span> Studio</div>
    
    <div class="toolbar-group">
      <!-- Botão Adicionar Objetos -->
      <div class="dropdown">
        <button class="btn btn-primary" onclick="toggleDropdown()">➕ Adicionar</button>
        <div class="dropdown-menu" id="add-menu">
          <div class="dropdown-item" onclick="addObject('Block')">🧊 Bloco (Block)</div>
          <div class="dropdown-item" onclick="addObject('Wedge')">📐 Cunha (Wedge)</div>
          <div class="dropdown-item" onclick="addObject('Sphere')">🔮 Esfera (Sphere)</div>
          <div class="dropdown-item" onclick="addObject('Cylinder')">🛢️ Cilindro (Cylinder)</div>
          <div class="dropdown-item" onclick="addScript()">📜 Novo Script</div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="runScript()">▶ Rodar</button>
      <button class="btn" onclick="toggleCameraMode()" id="btn-cam-mode">🧊 Modo: 3D</button>
    </div>
  </header>

  <!-- Area do Studio -->
  <div class="workspace">
    <!-- Esquerda: Code Editor -->
    <div class="panel-left active" id="pane-editor">
      <div class="panel-header">
        <span>Script Principal</span>
        <span>C-Voxel v2.0</span>
      </div>
      <div class="code-editor-container">
        <textarea class="code-input" id="code-input" spellcheck="false" oninput="updateEditor()"></textarea>
        <pre class="code-highlight" id="code-highlight"><code id="code-content"></code></pre>
      </div>
    </div>

    <!-- Centro: Viewport 3D + Output -->
    <div class="panel-center active" id="pane-viewport">
      <div id="viewport-container">
        <canvas id="three-canvas"></canvas>
        
        <!-- Joystick de Movimento Apenas -->
        <div id="joystick-zone">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- Output Console -->
      <div class="panel-output">
        <div class="panel-header">Output Console</div>
        <div class="output-logs" id="output-logs"></div>
      </div>
    </div>

    <!-- Direita: Explorer & Propriedades -->
    <div class="panel-right" id="pane-explorer">
      <div class="panel-header">Explorer</div>
      <div class="explorer-tree" id="explorer-list">
        <!-- Itens inseridos dinamicamente -->
      </div>

      <div class="panel-header">Propriedades</div>
      <div class="properties-grid" id="properties-panel">
        <div class="prop-row">
          <span class="prop-label">Nome</span>
          <input type="text" class="prop-input" id="prop-name" readonly />
        </div>
        <div class="prop-row">
          <span class="prop-label">Posição X,Y,Z</span>
          <input type="text" class="prop-input" id="prop-pos" onchange="applyPropertyChange()" />
        </div>
        <div class="prop-row">
          <span class="prop-label">Tamanho X,Y,Z</span>
          <input type="text" class="prop-input" id="prop-size" onchange="applyPropertyChange()" />
        </div>
        <div class="prop-row">
          <span class="prop-label">Cor (Hex)</span>
          <input type="color" class="prop-input" id="prop-color" onchange="applyPropertyChange()" style="height:26px;" />
        </div>
        <div class="prop-row">
          <span class="prop-label">Ancorado</span>
          <input type="checkbox" class="prop-checkbox" id="prop-anchor" onchange="applyPropertyChange()" />
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Tabs -->
  <div class="mobile-tabs">
    <button class="tab-btn active" onclick="switchMobileTab('pane-viewport', this)">🎮 Viewport</button>
    <button class="tab-btn" onclick="switchMobileTab('pane-editor', this)">📜 Script</button>
    <button class="tab-btn" onclick="switchMobileTab('pane-explorer', this)">📁 Explorer</button>
  </div>
</div>

<script>
  // --- ESTADO GLOBAL & OBJETOS ---
  let scene, camera, renderer, controls;
  let is2DMode = false;
  let workspaceObjects = {};
  let selectedObjectKey = null;
  let scriptCount = 0;

  // Código Inicial Padrão
  const defaultScript = `<Criando e testando objetos no C-Voxel>
block.Create:(Wedge, MinhaCunha)
block.Color:(MinhaCunha) = #FE5733
block.Position:(MinhaCunha) = 0, 0.5, 0

block.Create:(Block, MeuBloco)
block.Color:(MeuBloco) = #007ACC
block.Position:(MeuBloco) = 2, 0.5, 0
block.Anchor:(MeuBloco) = true`;

  // --- INICIALIZAÇÃO DA CENA THREE.JS ---
  function initThree() {
    const container = document.getElementById('viewport-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121316);

    // Câmeras (3D Perspectiva e 2D Ortográfica)
    const aspect = container.clientWidth / container.clientHeight;
    camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
    camera.position.set(4, 4, 6);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // Grade do Piso (Grid)
    const gridHelper = new THREE.GridHelper(20, 20, 0x007acc, 0x2d3037);
    scene.add(gridHelper);

    // OrbitControls (Rotação de câmera via Touch direto no Viewport)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function animate() {
    requestAnimationFrame(animate);
    updateJoystickMovement();
    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    const container = document.getElementById('viewport-container');
    if (!container) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  // --- ALTERNAR MODO 2D / 3D ---
  function toggleCameraMode() {
    is2DMode = !is2DMode;
    const btn = document.getElementById('btn-cam-mode');
    if (is2DMode) {
      btn.innerText = "📐 Modo: 2D";
      camera.position.set(0, 10, 0.01);
      controls.enableRotate = false; // Trava rotação em 2D
      logOutput("Modo de Visão alterado para 2D (Top-Down)", "info");
    } else {
      btn.innerText = "🧊 Modo: 3D";
      camera.position.set(4, 4, 6);
      controls.enableRotate = true;
      logOutput("Modo de Visão alterado para 3D (Perspectiva)", "info");
    }
    camera.lookAt(0,0,0);
  }

  // --- SINTAXE E HIGHLIGHT DO EDITOR ---
  function updateEditor() {
    const textarea = document.getElementById('code-input');
    const content = document.getElementById('code-content');
    let code = textarea.value;

    // Regex Syntax Highlighting
    let highlighted = code
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/(&lt;.*?&gt;)/g, '<span class="token-comment">$1</span>')
      .replace(/\b(block\.Create|block\.Color|block\.Position|block\.Size|block\.Anchor)\b/g, '<span class="token-kw">$1</span>')
      .replace(/\b(Block|Wedge|Sphere|Cylinder)\b/g, '<span class="token-type">$1</span>')
      .replace(/(#[a-fA-F0-9]{6})/g, '<span class="token-str">$1</span>')
      .replace(/\b(\d+(\.\d+)?)\b/g, '<span class="token-num">$1</span>');

    content.innerHTML = highlighted;
  }

  // Sync Scroll entre Textarea e Highlighting
  document.getElementById('code-input').addEventListener('scroll', function() {
    const highlight = document.getElementById('code-highlight');
    highlight.scrollTop = this.scrollTop;
    highlight.scrollLeft = this.scrollLeft;
  });

  // --- INTERPRETADOR DA LINGUAGEM C-VOXEL ---
  function runScript() {
    const code = document.getElementById('code-input').value;
    logOutput("Executando Script C-Voxel...", "info");

    // Limpa objetos antigos
    Object.keys(workspaceObjects).forEach(key => scene.remove(workspaceObjects[key].mesh));
    workspaceObjects = {};

    const lines = code.split('\n');
    lines.forEach(line => {
      line = line.trim();
      if (!line || line.startsWith('<')) return;

      if (line.startsWith('block.Create:')) {
        const match = line.match(/block\.Create:\s*\(([^,]+),\s*([^)]+)\)/);
        if (match) createGeometry(match[1].trim(), match[2].trim());
      } 
      else if (line.startsWith('block.Color:')) {
        const match = line.match(/block\.Color:\s*\(([^)]+)\)\s*=\s*(#[a-fA-F0-9]{6})/);
        if (match && workspaceObjects[match[1].trim()]) {
          workspaceObjects[match[1].trim()].mesh.material.color.set(match[2].trim());
          workspaceObjects[match[1].trim()].color = match[2].trim();
        }
      }
      else if (line.startsWith('block.Position:')) {
        const match = line.match(/block\.Position:\s*\(([^)]+)\)\s*=\s*([^,]+),\s*([^,]+),\s*(.+)/);
        if (match && workspaceObjects[match[1].trim()]) {
          const obj = workspaceObjects[match[1].trim()].mesh;
          obj.position.set(parseFloat(match[2]), parseFloat(match[3]), parseFloat(match[4]));
        }
      }
      else if (line.startsWith('block.Anchor:')) {
        const match = line.match(/block\.Anchor:\s*\(([^)]+)\)\s*=\s*(true|false)/);
        if (match && workspaceObjects[match[1].trim()]) {
          workspaceObjects[match[1].trim()].anchored = (match[2] === 'true');
        }
      }
    });

    updateExplorer();
    logOutput("Script executado com sucesso!", "info");
  }

  // --- CRIAÇÃO DE GEOMETRIAS 3D ---
  function createGeometry(type, name) {
    let geom;
    if (type === 'Wedge') {
      geom = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        -0.5,-0.5,0.5,  0.5,-0.5,0.5, -0.5,0.5,-0.5,   0.5,-0.5,0.5,  0.5,0.5,-0.5, -0.5,0.5,-0.5,
        -0.5,-0.5,-0.5, -0.5,-0.5,0.5, -0.5,0.5,-0.5,  0.5,-0.5,0.5,  0.5,-0.5,-0.5, 0.5,0.5,-0.5,
        -0.5,-0.5,-0.5, 0.5,-0.5,-0.5,  0.5,-0.5,0.5,  -0.5,-0.5,-0.5, 0.5,-0.5,0.5, -0.5,-0.5,0.5
      ]);
      geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geom.computeVertexNormals();
    } else if (type === 'Sphere') {
      geom = new THREE.SphereGeometry(0.5, 32, 16);
    } else if (type === 'Cylinder') {
      geom = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
    } else {
      geom = new THREE.BoxGeometry(1, 1, 1);
    }

    const mat = new THREE.MeshStandardMaterial({ color: 0x007acc, roughness: 0.4 });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(0, 0.5, 0);
    scene.add(mesh);

    workspaceObjects[name] = { mesh, type, name, color: '#007acc', anchored: false };
    selectObject(name);
  }

  // --- EXPLORER & PROPRIEDADES ---
  function updateExplorer() {
    const list = document.getElementById('explorer-list');
    list.innerHTML = '';

    Object.keys(workspaceObjects).forEach(key => {
      const item = document.createElement('div');
      item.className = `tree-item ${selectedObjectKey === key ? 'selected' : ''}`;
      item.innerHTML = `🧊 ${key} <span style="color:var(--text-muted);font-size:10px;">(${workspaceObjects[key].type})</span>`;
      item.onclick = () => selectObject(key);
      list.appendChild(item);
    });
  }

  function selectObject(key) {
    selectedObjectKey = key;
    updateExplorer();

    const obj = workspaceObjects[key];
    if (!obj) return;

    document.getElementById('prop-name').value = obj.name;
    document.getElementById('prop-pos').value = `${obj.mesh.position.x}, ${obj.mesh.position.y}, ${obj.mesh.position.z}`;
    document.getElementById('prop-size').value = `${obj.mesh.scale.x}, ${obj.mesh.scale.y}, ${obj.mesh.scale.z}`;
    document.getElementById('prop-color').value = obj.color;
    document.getElementById('prop-anchor').checked = obj.anchored;
  }

  function applyPropertyChange() {
    if (!selectedObjectKey || !workspaceObjects[selectedObjectKey]) return;
    const obj = workspaceObjects[selectedObjectKey];

    // Atualiza Posição
    const pos = document.getElementById('prop-pos').value.split(',').map(Number);
    if (pos.length === 3) obj.mesh.position.set(pos[0], pos[1], pos[2]);

    // Atualiza Tamanho
    const size = document.getElementById('prop-size').value.split(',').map(Number);
    if (size.length === 3) obj.mesh.scale.set(size[0], size[1], size[2]);

    // Atualiza Cor & Ancora
    obj.color = document.getElementById('prop-color').value;
    obj.mesh.material.color.set(obj.color);
    obj.anchored = document.getElementById('prop-anchor').checked;
  }

  // --- CONTROLE DE JOYSTICK APENAS (ESQUERDA) ---
  let joystickData = { active: false, dx: 0, dy: 0 };
  const zone = document.getElementById('joystick-zone');
  const knob = document.getElementById('joystick-knob');

  zone.addEventListener('touchstart', (e) => {
    joystickData.active = true;
    handleJoystickMove(e.touches[0]);
  });

  window.addEventListener('touchmove', (e) => {
    if (joystickData.active) handleJoystickMove(e.touches[0]);
  });

  window.addEventListener('touchend', () => {
    joystickData.active = false;
    joystickData.dx = 0; joystickData.dy = 0;
    knob.style.transform = `translate(0px, 0px)`;
  });

  function handleJoystickMove(touch) {
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let deltaX = touch.clientX - centerX;
    let deltaY = touch.clientY - centerY;
    const dist = Math.hypot(deltaX, deltaY);
    const maxDist = 35;

    if (dist > maxDist) {
      deltaX = (deltaX / dist) * maxDist;
      deltaY = (deltaY / dist) * maxDist;
    }

    knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
    joystickData.dx = deltaX / maxDist;
    joystickData.dy = deltaY / maxDist;
  }

  function updateJoystickMovement() {
    if (!joystickData.active || !selectedObjectKey) return;
    const obj = workspaceObjects[selectedObjectKey];
    if (obj && !obj.anchored) {
      obj.mesh.position.x += joystickData.dx * 0.1;
      obj.mesh.position.z += joystickData.dy * 0.1;
      document.getElementById('prop-pos').value = `${obj.mesh.position.x.toFixed(1)}, ${obj.mesh.position.y.toFixed(1)}, ${obj.mesh.position.z.toFixed(1)}`;
    }
  }

  // --- UTILS & MENUS ---
  function toggleDropdown() {
    document.getElementById('add-menu').classList.toggle('show');
  }

  function addObject(type) {
    const name = `${type}_${Object.keys(workspaceObjects).length + 1}`;
    createGeometry(type, name);
    toggleDropdown();
    logOutput(`Objeto '${name}' adicionado à cena.`, "info");
  }

  function addScript() {
    scriptCount++;
    logOutput(`Novo Script 'Script_${scriptCount}' adicionado ao Explorer.`, "info");
    toggleDropdown();
  }

  function logOutput(msg, type = 'info') {
    const logs = document.getElementById('output-logs');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `[C-Voxel] ${msg}`;
    logs.appendChild(entry);
    logs.scrollTop = logs.scrollHeight;
  }

  function switchMobileTab(tabId, btn) {
    document.querySelectorAll('.panel-left, .panel-center, .panel-right').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    if (tabId === 'pane-viewport') onWindowResize();
  }

  // Init
  window.onload = () => {
    document.getElementById('code-input').value = defaultScript;
    initThree();
    updateEditor();
    runScript();
  };
</script>
</body>
</html>
