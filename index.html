<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C-Voxel Studio Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/darcula.min.css">

    <style>
        :root {
            --bg-dark: #121316;
            --bg-panel: #1e1f24;
            --bg-header: #18191c;
            --border-color: #2d3037;
            --accent-color: #007acc;
            --accent-hover: #0098ff;
            --text-main: #e1e4ea;
            --text-muted: #8b909a;
            --success: #4af626;
            --danger: #f14c4c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Topbar Header */
        header {
            height: 38px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .toolbar-btns {
            display: flex;
            gap: 6px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #33363d; }
        button.secondary:hover { background-color: #444851; }
        button.danger { background-color: var(--danger); }

        /* Workspace Grid Layout */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Editor Pane */
        .editor-pane {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .pane-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 6px 10px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-size: 12px;
        }

        /* Viewport 3D */
        .viewport-pane {
            flex: 1;
            position: relative;
            background-color: #0d0e11;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* Console Output */
        .output-box {
            height: 90px;
            background-color: #08090b;
            border-top: 1px solid var(--border-color);
            padding: 6px 8px;
            font-size: 10px;
            font-family: monospace;
            overflow-y: auto;
        }

        .log-info { color: var(--text-main); }
        .log-success { color: var(--success); }
        .log-error { color: var(--danger); }

        /* Painel Inspector / Explorer */
        .right-pane {
            width: 220px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 2;
            font-size: 11px;
        }

        .explorer-section, .properties-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .tree-item {
            padding: 6px 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tree-item:hover { background-color: rgba(255,255,255,0.05); }
        .tree-item.selected { background-color: var(--accent-color); color: #fff; }

        .prop-container { padding: 8px; }
        .prop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .prop-label { color: var(--text-muted); font-size: 10px; }
        .prop-row input {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 5px;
            font-size: 10px;
            width: 55px;
            border-radius: 3px;
            text-align: center;
        }

        /* Joystick Mobile */
        #joystickBase {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 100;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystickKnob {
            width: 35px;
            height: 35px;
            background: rgba(0, 122, 204, 0.85);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Ajuste de Tela para Celular */
        @media (max-width: 800px) {
            .editor-pane { width: 38%; }
            .right-pane { width: 28%; }
            #joystickBase { width: 70px; height: 70px; bottom: 12px; left: 12px; }
            #joystickKnob { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">C-VOXEL STUDIO</div>
        <div class="toolbar-btns">
            <button class="secondary" onclick="engine.resetCamera()">Reset Cam</button>
            <button class="danger" onclick="engine.clearScene()">Limpar</button>
            <button onclick="engine.compileAndRun()">▶ Executar</button>
        </div>
    </header>

    <div class="workspace">
        <div class="editor-pane">
            <div class="pane-title">Script Principal</div>
            <textarea id="codeEditor">
// Criando objetos no C-Voxel
block.Create(Wedge, MinhaCunha);
MinhaCunha.Color = #FF5733;
MinhaCunha.Position = 0, 0.5, 0;

block.Create(Cube, MeuBloco);
MeuBloco.Color = #007ACC;
MeuBloco.Position = 2, 0.5, 0;
</textarea>
            <div class="pane-title">Console Output</div>
            <div class="output-box" id="consoleOutput"></div>
        </div>

        <div class="viewport-pane" id="viewport">
            <canvas id="renderCanvas"></canvas>
            <div id="joystickBase"><div id="joystickKnob"></div></div>
        </div>

        <div class="right-pane">
            <div class="pane-title">Explorer</div>
            <div class="explorer-section" id="hierarchyList"></div>

            <div class="pane-title">Propriedades</div>
            <div class="properties-section" id="inspectorPanel">
                <div style="color: #666; text-align: center; margin-top: 15px; font-size: 10px;">
                    Selecione um objeto
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <script>
        class CVoxelEngine {
            constructor() {
                this.objects = new Map();
                this.selectedObject = null;
                this.joyX = 0;
                this.joyY = 0;

                this.initUI();
                this.init3D();
                this.initControls();
                this.log("Engine inicializada com sucesso.", "success");
            }

            initUI() {
                this.editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                    mode: "javascript",
                    theme: "darcula",
                    lineNumbers: true,
                    tabSize: 2
                });

                this.domHierarchy = document.getElementById('hierarchyList');
                this.domInspector = document.getElementById('inspectorPanel');
                this.domConsole = document.getElementById('consoleOutput');
            }

            init3D() {
                const canvas = document.getElementById('renderCanvas');
                const container = document.getElementById('viewport');

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x121316);

                this.camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, 6, 10);

                this.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const ambient = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(5, 10, 7);
                this.scene.add(dirLight);

                const grid = new THREE.GridHelper(30, 30, 0x33363d, 0x22242a);
                grid.position.y = -0.01;
                this.scene.add(grid);

                this.orbit = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.orbit.enableDamping = true;
                this.orbit.dampingFactor = 0.05;

                this.transform = new THREE.TransformControls(this.camera, this.renderer.domElement);
                this.transform.addEventListener('dragging-changed', (e) => {
                    this.orbit.enabled = !e.value;
                });
                this.transform.addEventListener('change', () => this.updateInspector());
                this.scene.add(this.transform);

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                window.addEventListener('resize', () => {
                    this.camera.aspect = container.clientWidth / container.clientHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(container.clientWidth, container.clientHeight);
                });

                this.animate();
            }

            initControls() {
                const canvas = document.getElementById('renderCanvas');
                canvas.addEventListener('pointerdown', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    const interactables = Array.from(this.objects.values()).map(o => o.mesh);
                    const intersects = this.raycaster.intersectObjects(interactables);

                    if (intersects.length > 0) {
                        const target = intersects[0].object;
                        for (let [name, obj] of this.objects.entries()) {
                            if (obj.mesh === target) {
                                this.selectObject(name);
                                break;
                            }
                        }
                    }
                });

                // Joystick Setup
                const base = document.getElementById('joystickBase');
                const knob = document.getElementById('joystickKnob');
                let activeId = null;

                base.addEventListener('pointerdown', (e) => {
                    activeId = e.pointerId;
                    base.setPointerCapture(activeId);
                });

                base.addEventListener('pointermove', (e) => {
                    if (activeId !== e.pointerId) return;
                    const rect = base.getBoundingClientRect();
                    let dx = e.clientX - (rect.left + rect.width / 2);
                    let dy = e.clientY - (rect.top + rect.height / 2);
                    const dist = Math.hypot(dx, dy);
                    const maxDist = 25;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                    this.joyX = dx / maxDist;
                    this.joyY = dy / maxDist;
                });

                const releaseJoy = (e) => {
                    if (activeId === e.pointerId) {
                        activeId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        this.joyX = 0;
                        this.joyY = 0;
                    }
                };

                base.addEventListener('pointerup', releaseJoy);
                base.addEventListener('pointercancel', releaseJoy);
            }

            log(msg, type = 'info') {
                const div = document.createElement('div');
                div.className = `log-${type}`;
                div.innerText = `> ${msg}`;
                this.domConsole.appendChild(div);
                this.domConsole.scrollTop = this.domConsole.scrollHeight;
            }

            clearScene() {
                this.deselect();
                this.objects.forEach(obj => {
                    this.scene.remove(obj.mesh);
                    obj.mesh.geometry.dispose();
                    obj.mesh.material.dispose();
                });
                this.objects.clear();
                this.refreshHierarchy();
                this.log("Cena limpa.", "info");
            }

            resetCamera() {
                this.camera.position.set(0, 6, 10);
                this.orbit.target.set(0, 0, 0);
            }

            compileAndRun() {
                this.clearScene();
                const code = this.editor.getValue();
                const lines = code.split('\n');

                try {
                    lines.forEach((line) => {
                        line = line.trim();
                        if (!line || line.startsWith('//')) return;

                        const createMatch = line.match(/block\.Create\s*\(\s*(\w+)\s*,\s*(\w+)\s*\)/i);
                        if (createMatch) {
                            this.instantiate(createMatch[1], createMatch[2]);
                            return;
                        }

                        const propMatch = line.match(/(\w+)\.(\w+)\s*=\s*(.+)/);
                        if (propMatch) {
                            const objName = propMatch[1];
                            const prop = propMatch[2];
                            const val = propMatch[3].replace(';', '').trim();
                            if (this.objects.has(objName)) {
                                this.applyProperty(this.objects.get(objName), prop, val);
                            }
                        }
                    });

                    this.refreshHierarchy();
                    if (this.objects.size > 0) {
                        this.selectObject(this.objects.keys().next().value);
                    }
                    this.log("Executado com sucesso!", "success");
                } catch (err) {
                    this.log(`Erro no script: ${err.message}`, "error");
                }
            }

            instantiate(type, name) {
                let geo;
                const t = type.toLowerCase();
                if (t === 'cube' || t === 'block') geo = new THREE.BoxGeometry(1, 1, 1);
                else if (t === 'sphere') geo = new THREE.SphereGeometry(0.5, 32, 32);
                else if (t === 'cylinder') geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                else if (t === 'wedge') {
                    geo = new THREE.BufferGeometry();
                    const v = new Float32Array([-0.5,-0.5,0.5, 0.5,-0.5,0.5, 0.5,-0.5,-0.5, -0.5,-0.5,-0.5, -0.5,0.5,-0.5, 0.5,0.5,-0.5]);
                    const idx = [0,1,4, 1,5,4, 3,2,1, 3,1,0, 3,0,4, 2,5,1, 3,4,5, 3,5,2];
                    geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
                    geo.setIndex(idx);
                    geo.computeVertexNormals();
                } else {
                    geo = new THREE.BoxGeometry(1, 1, 1);
                }

                const mat = new THREE.MeshStandardMaterial({ color: 0x007acc, roughness: 0.4 });
                const mesh = new THREE.Mesh(geo, mat);
                this.scene.add(mesh);

                this.objects.set(name, { name, mesh, type });
            }

            applyProperty(obj, prop, val) {
                const p = prop.toLowerCase();
                if (p === 'color') {
                    obj.mesh.material.color.set(val);
                } else if (['position', 'scale', 'rotation'].includes(p)) {
                    const parts = val.split(',').map(n => parseFloat(n.trim()));
                    if (parts.length === 3) {
                        if (p === 'position') obj.mesh.position.set(...parts);
                        if (p === 'scale') obj.mesh.scale.set(...parts);
                        if (p === 'rotation') obj.mesh.rotation.set(parts[0]*Math.PI/180, parts[1]*Math.PI/180, parts[2]*Math.PI/180);
                    }
                }
            }

            refreshHierarchy() {
                this.domHierarchy.innerHTML = '';
                this.objects.forEach((obj, name) => {
                    const item = document.createElement('div');
                    item.className = `tree-item ${this.selectedObject === obj ? 'selected' : ''}`;
                    item.innerHTML = `🧊 ${name}`;
                    item.onclick = () => this.selectObject(name);
                    this.domHierarchy.appendChild(item);
                });
            }

            selectObject(name) {
                if (!this.objects.has(name)) return;
                this.selectedObject = this.objects.get(name);
                this.transform.attach(this.selectedObject.mesh);
                this.refreshHierarchy();
                this.updateInspector();
            }

            deselect() {
                this.selectedObject = null;
                this.transform.detach();
                this.refreshHierarchy();
                this.domInspector.innerHTML = `<div style="color: #666; text-align: center; margin-top: 15px; font-size: 10px;">Selecione um objeto</div>`;
            }

            updateInspector() {
                if (!this.selectedObject) return;
                const m = this.selectedObject.mesh;
                this.domInspector.innerHTML = `
                    <div class="prop-container">
                        <div style="font-weight:bold; margin-bottom:10px; color:var(--accent-color);">📦 ${this.selectedObject.name}</div>
                        <div class="prop-row"><span class="prop-label">Pos X</span><input type="number" step="0.1" value="${m.position.x.toFixed(2)}" onchange="engine.setPos('x',this.value)"></div>
                        <div class="prop-row"><span class="prop-label">Pos Y</span><input type="number" step="0.1" value="${m.position.y.toFixed(2)}" onchange="engine.setPos('y',this.value)"></div>
                        <div class="prop-row"><span class="prop-label">Pos Z</span><input type="number" step="0.1" value="${m.position.z.toFixed(2)}" onchange="engine.setPos('z',this.value)"></div>
                    </div>
                `;
            }

            setPos(axis, val) {
                if (this.selectedObject) {
                    this.selectedObject.mesh.position[axis] = parseFloat(val);
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                if (this.selectedObject && (this.joyX !== 0 || this.joyY !== 0)) {
                    const speed = 0.08;
                    let forward = new THREE.Vector3();
                    this.camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    let right = new THREE.Vector3();
                    right.crossVectors(this.camera.up, forward).normalize();

                    this.selectedObject.mesh.position.addScaledVector(right, this.joyX * speed);
                    this.selectedObject.mesh.position.addScaledVector(forward, -this.joyY * speed);
                    this.updateInspector();
                }

                this.orbit.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        const engine = new CVoxelEngine();
        setTimeout(() => engine.compileAndRun(), 300);
    </script>
</body>
</html>
